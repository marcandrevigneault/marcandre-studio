name: Frontend and phone simulations
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: npm run test:frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
